apis:
- aid: ikea:dirigera-hub
  name: IKEA DIRIGERA Smart Home Hub API (Unofficial, Local)
  description: >-
    The DIRIGERA hub is IKEA's next-generation smart home gateway (replacing TRADFRI). It exposes a private,
    locally-served REST API on the LAN with bearer-token authentication (token obtained by pressing the
    action button on the hub). There is no public OpenAPI from IKEA; the community has produced several
    SDKs that document and consume the surface — Leggin/dirigera (Python), lpgera/dirigera (TypeScript),
    dvdgeisler/DirigeraClient (Java), bombsimon/dirigera-rs (Rust). Resources include lights, outlets,
    blinds, air purifiers, environment sensors, motion sensors, open/close sensors, scenes, rooms and
    an event listener websocket. Not an official IKEA developer API.
  humanURL: https://github.com/Leggin/dirigera
  tags:
  - Smart Home
  - DIRIGERA
  - IoT
  - Local API
  - Unofficial API
  - Opensource
